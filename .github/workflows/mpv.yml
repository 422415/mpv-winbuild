name: AJN 3.6.1 Windows test
run-name: AJN 3.6.1-test.1 native build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Start Windows audio services for playback tests
        shell: pwsh
        run: |
          # Server runners have no speakers, but device notification cleanup
          # still needs the audio services used by ordinary Windows desktops.
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          Get-Service AudioEndpointBuilder, Audiosrv
      - uses: actions/checkout@v4
        with:
          repository: 422415/mpv
          ref: 21d5e10e5ca27a4b8a6dd4a8bbb02062bb8e6e24
          path: mpv-source
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: 422415/libass
          ref: e813acd072d3f0f13aecf1966c5acec8b3ef7a1d
          path: libass-source
          fetch-depth: 1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-ffnvcodec-headers
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libunibreak
            mingw-w64-ucrt-x86_64-luajit
            mingw-w64-ucrt-x86_64-mujs
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-vulkan-headers
      - name: Build and test pinned native components
        run: bash test-build/build-windows.sh
      - name: Upload native test package
        uses: actions/upload-artifact@v4
        with:
          name: ajn-3.6.1-test.1-native-win-x64
          path: native-output/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ajn-3.6.1-test.1-native-logs
          path: |
            build-ass/meson-logs/
            build-mpv/meson-logs/
            native-output/build-info/
          retention-days: 14
      - name: Upload diagnostic binaries on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ajn-3.6.1-test.1-native-diagnostic
          path: native-output/
          if-no-files-found: ignore
          retention-days: 3
